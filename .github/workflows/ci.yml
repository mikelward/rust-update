name: CI

# Consumers reference the reusable workflow at `@main` -- no tag, no SHA,
# deliberately, since bumping a pin in every repository is the cost
# centralizing was meant to remove. So this suite runs on the pull request,
# which is the only gate between a change and every consumer's weekly run:
# there is no release step afterwards to catch anything. The `push` run below
# re-checks the commit the merge produced.
on:
  push:
    branches: [main]
  pull_request:
    # `edited` is here because a retarget changes what the PR's diff is
    # measured against while the head — and any `gate` check run already
    # minted on it — stays put, so a base change must start a fresh run.
    # Title and body edits re-run the lane too, deliberately: a skipped
    # job would be worse, because GitHub counts a skipped required check
    # as satisfied, so skipping the gate on a "harmless" edit would let a
    # newer skipped run replace a red verdict on the same head.
    types: [opened, synchronize, reopened, edited]

# Nothing here writes to the repository. The docs lane's classify and gate
# steps read the PR's files and commits through the workflow token;
# read-only, and still nothing here can write.
permissions:
  contents: read
  pull-requests: read

jobs:
  # Decides whether the test job may skip: true only when every changed
  # file in the PR is housekeeping (markdown — see scripts/docs-lane.sh for
  # the rule). Pushes to main are always classified as code.
  classify:
    name: Classify the diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.run.outputs.docs_only }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - name: Self-test the lane rules
        # Before trusting the classification, prove the rule engine against
        # its fixture matrix (stubbed gh, both directions per behavior). A
        # broken rule fails here, the test job skips on the failed
        # dependency, and the gate goes red — fail closed, never green.
        run: scripts/docs-lane.test.sh
      - name: Classify
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: scripts/docs-lane.sh classify >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '24'

      # No install step, because there is nothing to install: the checker and
      # its suite are dependency-free on purpose, so what runs inside a
      # consumer's workflow is exactly what a reader reads here.
      - name: Test
        run: node --test *.test.js

      - name: Shellcheck the lane scripts
        run: shellcheck -s bash -S error scripts/docs-lane.sh scripts/docs-lane.test.sh

  # The one check the main ruleset requires. Always runs, always reports —
  # green only when the test job succeeded, or when it was skipped and the
  # skip is INDEPENDENTLY verified as justified: the diff re-derived as
  # housekeeping-only and every commit subject carrying a housekeeping
  # prefix. Any other combination is an explicit red, never a silent pass.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, test]
    if: always()
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - name: Verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CLASSIFY: ${{ needs.classify.result }}
          # Every job the gate weighs: a job added to this workflow but
          # missing from RESULTS (and needs) is invisible to the verdict.
          RESULTS: >-
            test=${{ needs.test.result }}
        run: scripts/docs-lane.sh gate
