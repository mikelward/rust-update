name: CI

# Consumers reference the reusable workflow at `@main` -- no tag, no SHA,
# deliberately, since bumping a pin in every repository is the cost
# centralizing was meant to remove. So this suite runs on the pull request,
# which is the only gate between a change and every consumer's weekly run:
# there is no release step afterwards to catch anything. The `push` run below
# re-checks the commit the merge produced.
on:
  push:
    branches: [main]
  pull_request:
    # `edited` is here because a retarget changes what the PR's diff is
    # measured against while the head — and any `gate` check run already
    # minted on it — stays put, so a base change must start a fresh run.
    # Title and body edits re-run the lane too, deliberately: a skipped
    # job would be worse, because GitHub counts a skipped required check
    # as satisfied, so skipping the gate on a "harmless" edit would let a
    # newer skipped run replace a red verdict on the same head.
    types: [opened, synchronize, reopened, edited]

# Nothing here writes to the repository. The docs lane's classify and gate
# jobs read the PR's files and commits through the workflow token;
# read-only, and still nothing here can write.
permissions:
  contents: read
  pull-requests: read

jobs:
  # Decides whether the test job may skip: true only when every changed
  # file in the PR is housekeeping (markdown — see .github/lanes.conf for
  # the rule; the engine is mikelward/lanes). Pushes to main are always
  # classified as code.
  classify:
    name: Classify the diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.lane.outputs.docs_only }}
      base_sha: ${{ steps.lane.outputs.base_sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        id: lane
        with:
          mode: classify
          pr: ${{ github.event.pull_request.number }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '24'

      # No install step, because there is nothing to install: the checker and
      # its suite are dependency-free on purpose, so what runs inside a
      # consumer's workflow is exactly what a reader reads here.
      - name: Test
        run: node --test *.test.js

  # The one check the main ruleset requires. Always runs, always reports —
  # green only when the test job succeeded, or when it was skipped and the
  # skip is INDEPENDENTLY verified as justified: the gate re-derives the
  # classification itself rather than trusting classify's output. Any other
  # combination is an explicit red, never a silent pass.
  #
  # TEMPORARY, alongside `lanes` below: mikelward/lanes renamed its
  # consumer-facing check from `gate` to `lanes` (mikelward/lanes#9), and the
  # ruleset here still requires `gate`. Per that PR's staged-rename
  # procedure, this duplicate keeps `gate` reporting until the ruleset is
  # flipped to require `lanes` instead — then this job is deleted.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, test]
    if: always()
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        with:
          mode: gate
          pr: ${{ github.event.pull_request.number }}
          classify-result: ${{ needs.classify.result }}
          # Only read on a dispatched run, and harmless on a pull_request one,
          # which takes the same commit from its own event payload.
          base-sha: ${{ needs.classify.outputs.base_sha }}
          results: >-
            test=${{ needs.test.result }}

  # The renamed check (mikelward/lanes#9) — this is what the ruleset should
  # require once it has reported at least once. Identical to `gate` above;
  # see that job's comment for why both exist for now.
  lanes:
    name: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, test]
    if: always()
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        with:
          mode: gate
          pr: ${{ github.event.pull_request.number }}
          classify-result: ${{ needs.classify.result }}
          # Only read on a dispatched run, and harmless on a pull_request one,
          # which takes the same commit from its own event payload.
          base-sha: ${{ needs.classify.outputs.base_sha }}
          results: >-
            test=${{ needs.test.result }}
