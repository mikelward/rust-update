name: Dependency update

# One batched Cargo dependency PR per week, as a REUSABLE workflow — the Rust
# sibling of npm-update and gradle-update, consumed with:
#
#   uses: mikelward/rust-update/.github/workflows/rust-update.yml@main
#
# from a small caller workflow that owns the cron. See README.md for the
# caller shape and the permissions it must grant.
#
# update-lockfile.mjs refreshes Cargo.lock via `cargo update` — every package
# moves to the newest eligible stable release WITHIN its semver-compatible
# range (Cargo's caret rule: same major, same minor at 0.x), so nothing can
# cross a breaking boundary, direct or transitive: the engine pins back a
# dependent whose bump would drag a transitive across one, and the publish
# job re-derives the whole claim from the diff (check-rust-update.mjs) and
# stops the run if anything did. Majors stay a deliberate, human-initiated
# migration. Cargo.toml is never touched.
#
# The promise here is STRONGER than gradle-update's: the lockfile pins every
# transitive exactly, so the diff the validator walks is the complete story —
# there is no unlocked layer underneath it.
#
# The trust split is inherited from npm-update wholesale: resolving versions
# runs `cargo update` (the consumer's pinned toolchain — no dependency code;
# build scripts and proc macros only execute when something COMPILES) plus
# registry metadata over HTTPS, but the consumer's checks that validate the
# batch compile and run dependency code by definition. So the update job
# holds no write token, the lockfile is fingerprinted before the checks run,
# and the publish job — a fresh runner that never executes what the batch
# installed — is where the diff is actually validated and pushed.

on:
  workflow_call:
    inputs:
      lockfile:
        description: Path to the workspace's Cargo.lock.
        type: string
        default: Cargo.lock
      cooldown-days:
        description: >-
          Minimum age in days of a release before this job will take it — the
          Cargo analog of .npmrc's min-release-age, so a compromised release
          has time to be yanked before an unattended job picks it up.
        type: number
        default: 5
      checks:
        description: >-
          Commands that validate the batch, one per line. They run in the
          update job, after the lockfile is rewritten and fingerprinted, in
          the directory holding the lockfile's manifest.
        type: string
        default: |
          cargo test --locked
      commit-prefix:
        description: >-
          Subject prefix for the batch commit and PR title, or empty for a
          bare subject. Consumers whose commit conventions prefix
          non-behavior changes set it here.
        type: string
        default: ''
      ci-workflow:
        description: >-
          Workflow file to dispatch against the pushed branch, with a `pr`
          input naming the pull request. A pull request this job opens
          under GITHUB_TOKEN's identity DOES trigger a consumer's own
          `on: pull_request` workflows, same as any other — but GitHub gates
          that run pending manual approval, since GITHUB_TOKEN's identity
          (`github-actions[bot]`) is not a repository collaborator; nothing
          runs until someone clicks approve. Dispatch sidesteps the gate
          (see docs/GITHUB_APP.md for the version-controlled fix: a GitHub
          App installation, which IS a collaborator). It must carry
          `workflow_dispatch` on the default branch. Empty disables the
          dispatch.
        type: string
        default: ''
    secrets:
      app-id:
        description: >-
          A GitHub App's ID, for minting a short-lived installation token to
          push the branch and open the pull request with instead of
          GITHUB_TOKEN — see docs/GITHUB_APP.md. Optional; omit both this
          and app-private-key to keep using GITHUB_TOKEN. Providing one
          without the other is refused: a partial credential mints no
          token, and failing loudly beats silently falling back to the
          weaker one.
        required: false
      app-private-key:
        description: The App's private key (the full .pem contents), paired with app-id.
        required: false

# No permissions here: the CALLER grants them (contents: write,
# pull-requests: write, actions: write), and each job below downscopes. The
# job that runs unreviewed dependency code gets a read-only token; only the
# publish job, which runs none, can write.

jobs:
  # Rewrites the lockfile and runs the checks. Compiling executes
  # third-party build scripts and proc macros here, so this job holds no
  # write token and cannot push anything.
  update:
    runs-on: ubuntu-latest
    # The checks compile and run unreviewed dependency code; without a
    # bound, a hung build holds the runner for the 6-hour job default.
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
      passed: ${{ steps.checks.outputs.passed }}
      base: ${{ steps.base.outputs.sha }}
      lockfile_sha: ${{ steps.changed.outputs.lockfile_sha }}
      engine_sha: ${{ steps.engine.outputs.sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          # Always the default branch, never the dispatch ref: a manual run
          # from a feature branch must not base the dependency branch on it.
          # (If the expression is ever empty, checkout falls back to the
          # default branch anyway, so the failure mode is benign.)
          ref: ${{ github.event.repository.default_branch }}
          # The checks execute unreviewed code; the token is read-only, and
          # dropping it from .git/config keeps one less credential in reach
          # anyway.
          persist-credentials: false

      # Pinned and handed to the publish job, so a commit landing on the
      # default branch while the checks run cannot be silently reverted by
      # publishing a lockfile resolved against the older base.
      - name: Record the base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The engine, from this repository at main — the same convention as
      # consuming the workflow itself at @main: no build step, no
      # dependencies, the file that runs is the file you can read there.
      - name: Fetch the update engine
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          repository: mikelward/rust-update
          ref: main
          path: .rust-update
          persist-credentials: false

      # One immutable revision for the whole run: the publish job checks the
      # validator out at THIS sha, so main advancing mid-run cannot validate
      # the batch under different rules than resolved it.
      - name: Record the engine revision
        id: engine
        run: echo "sha=$(git -C .rust-update rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Runs `cargo update` under the consumer's pinned toolchain, then
      # enforces the cooldown and the no-transitive-majors rule from
      # registry metadata over HTTPS. No dependency code executes here —
      # that starts with the checks below, after the fingerprint. The
      # lockfile path travels as an environment variable here and in every
      # later shell step: inlining it into single-quoted script text would
      # break on an apostrophe in a custom path.
      - name: Resolve updates within their compatible ranges
        env:
          LOCKFILE: ${{ inputs.lockfile }}
          # Typed as a number so it cannot carry shell syntax, but env is the
          # discipline every input here travels by — data, never script text.
          COOLDOWN_DAYS: ${{ inputs.cooldown-days }}
        run: |
          set -euo pipefail
          # Every comparison this workflow makes against the lockfile path —
          # the reserved-name guard below, the tree check's literal
          # allowlist, the adoption diff — is a string comparison, so the
          # path must arrive in canonical workspace-relative form: a spelled
          # variant like `./Cargo.lock` names the same file while matching
          # none of the strings. Refuse anything non-canonical (with the
          # canonical spelling in the message) rather than guessing which
          # comparisons the variant would slip past.
          canon=$(realpath -m --relative-to="$PWD" -- "$LOCKFILE")
          if [ "$canon" != "$LOCKFILE" ]; then
            echo "::error::lockfile path '$LOCKFILE' is not in canonical repo-relative form; use '$canon'."
            exit 1
          fi
          # And it must NAME a Cargo.lock: Cargo has no stable option to
          # read or write a lockfile under any other name, so a custom
          # filename would leave cargo updating a Cargo.lock beside it
          # while the workflow watches the wrong file and reports an
          # eternally clean run. (The engine refuses this too; refusing
          # here names the input that caused it.)
          case "$LOCKFILE" in
            Cargo.lock|*/Cargo.lock) ;;
            *)
              echo "::error::lockfile path '$LOCKFILE' must name a Cargo.lock — Cargo supports no other lockfile filename."
              exit 1;;
          esac
          # The run writes these files and directories at the workspace
          # root. A lockfile named like one of them would be clobbered by
          # the run's own output; one NESTED under such a name means the
          # checkout already occupies the name with a directory the run
          # cannot write over — and a lockfile under the engine or artifact
          # directories would be deleted by their cleanup. All of it is the
          # same class, refused up front with the reason, as exact names AND
          # as path prefixes. `..` leaves the repository, which no
          # consumer's lockfile does.
          case "$LOCKFILE" in
            ..|../*|report.md|checks.md|deps-stat.txt|handoff-cargo.lock|body.md|.rust-update|.dependency-update|\
            report.md/*|checks.md/*|deps-stat.txt/*|handoff-cargo.lock/*|body.md/*|.rust-update/*|.dependency-update/*)
              echo "::error::lockfile path '$LOCKFILE' collides with a file or directory this workflow uses, or leaves the repository; choose a different lockfile path."
              exit 1;;
          esac
          # The scratch names must also not be files the CONSUMER tracks:
          # the run would overwrite them before the checks read them, and
          # the tree check deliberately allowlists these names, so the
          # clobber would pass unseen. The engine and artifact directories
          # are the same class through a different mechanism — their cleanup
          # (`rm -rf`) would delete tracked content and the tree check would
          # abort every run on the deletions. Same answer: refuse with the
          # reason.
          tracked=$(git ls-files -- report.md checks.md deps-stat.txt body.md handoff-cargo.lock .rust-update .dependency-update)
          if [ -n "$tracked" ]; then
            echo "::error::this workflow writes scratch files at the workspace root that this repository tracks:"
            echo "$tracked"
            echo '::error::rename or move those files to run the weekly update.'
            exit 1
          fi
          node .rust-update/update-lockfile.mjs \
            --lockfile "$LOCKFILE" \
            --cooldown-days "$COOLDOWN_DAYS" \
            --markdown report.md
          # The engine has done its work; removing it keeps the tree check
          # below simple and honest.
          rm -rf .rust-update

      - name: Stop early if nothing moved
        id: changed
        env:
          LOCKFILE: ${{ inputs.lockfile }}
          # The lockfile path is data everywhere, including as a git
          # pathspec: without this, a filename carrying pathspec syntax
          # (`*`, `?`) would glob instead of naming the one file.
          GIT_LITERAL_PATHSPECS: '1'
        run: |
          set -euo pipefail
          if git diff --quiet -- "$LOCKFILE"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No dependency updates available this run.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            git diff --stat -- "$LOCKFILE" > deps-stat.txt
            # Fingerprint now, before any dependency code runs. A step
            # OUTPUT rather than a file: the runner captures it when this
            # step ends, and nothing that runs afterwards can reach back
            # and change it.
            echo "lockfile_sha=$(sha256sum -- "$LOCKFILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            git diff -- "$LOCKFILE" >> "$GITHUB_STEP_SUMMARY"
          fi

      # A PR opened by GITHUB_TOKEN triggers no `on: pull_request` workflows
      # (GitHub's loop-prevention rule), so the consumer's CI will NOT run
      # on the update PR by itself: the checks happen HERE or not at all.
      # Every check runs even after one fails, so the PR body reports the
      # whole picture. Compiling executes build scripts and proc macros from
      # the versions this run just picked — this is the untrusted window.
      - name: Run the checks
        if: steps.changed.outputs.changed == 'true'
        id: checks
        env:
          CHECKS: ${{ inputs.checks }}
          LOCKFILE: ${{ inputs.lockfile }}
        run: |
          set +e
          # The checks run where the manifest lives, so a workspace under a
          # subdirectory gets `cargo test` in the right place; the loop's
          # own bookkeeping stays at the workspace root.
          checkdir=$(dirname -- "$LOCKFILE")
          failed=0
          : > checks.md
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            echo "::group::$cmd"
            # A subshell, so a check that changes shell state — `cd crates
            # && cargo test`, an export — cannot move where the loop writes
            # checks.md or where the next check runs. The runner command
            # files are pointed at /dev/null inside it: they are the channel
            # a planted process would use to forge THIS step's own outputs
            # (a "passed=true" written into $GITHUB_OUTPUT from inside a
            # check). Code running as this user can still hunt the real
            # files down on disk — same-machine isolation is not claimed,
            # and the design already reads check results as evidence, not
            # proof — but the casual channel costs one line to close.
            ( export GITHUB_OUTPUT=/dev/null GITHUB_ENV=/dev/null \
                GITHUB_PATH=/dev/null GITHUB_STEP_SUMMARY=/dev/null \
                GITHUB_STATE=/dev/null
              cd -- "$checkdir" && eval "$cmd" )
            rc=$?
            echo '::endgroup::'
            if [ $rc -eq 0 ]; then
              echo "- ✅ \`$cmd\`" >> checks.md
            else
              echo "- ❌ \`$cmd\` (exit $rc)" >> checks.md
              failed=1
            fi
          done <<< "$CHECKS"
          # FAIL CLOSED from here: the writes below are the authoritative
          # record, and a record that cannot be written (a check made the
          # file read-only, say) must go red rather than let a forged or
          # missing verdict decide the title and the arming.
          set -e
          cat checks.md >> "$GITHUB_STEP_SUMMARY"
          if [ $failed -eq 0 ]; then
            echo 'passed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'passed=false' >> "$GITHUB_OUTPUT"
          fi
          # Build scripts and proc macros ran above and $GITHUB_PATH /
          # $GITHUB_ENV apply to LATER steps, so a planted binary could
          # otherwise shadow `git` and `sha256sum` for the verification
          # below. Emptying them means the runner applies nothing.
          : > "$GITHUB_PATH"
          : > "$GITHUB_ENV"

      # The checks above and the artifact below have to describe the SAME
      # tree. Anything outside the lockfile is a stop, not something to
      # strip silently: a dependency that rewrites your source during a
      # build is a decision for a human.
      - name: Verify only the lockfile changed
        if: steps.changed.outputs.changed == 'true'
        env:
          LOCKFILE: ${{ inputs.lockfile }}
          LOCKFILE_SHA: ${{ steps.changed.outputs.lockfile_sha }}
        run: |
          set -euo pipefail
          # `git status`, not `git diff`: diff only sees tracked changes, so
          # an untracked file dropped into the tree by a build script would
          # sail past it. The allowed extras are files this job writes
          # itself. `grep -Fx`, not a regex: the lockfile path is data, and
          # even the default path's dot would otherwise match any character
          # — a planted `CargoXlock` must not ride the allowlist, and a
          # metacharacter in a custom path must not break the guard. `-z` so
          # git emits paths raw: its C-quoting of spaces and non-ASCII would
          # otherwise never equal the literal $LOCKFILE and fail every
          # publication under such a path.
          unexpected=$(git status --porcelain -z --untracked-files=all \
            | tr '\0' '\n' | sed '/^$/d' \
            | sed 's/^...//' \
            | grep -Fxv -e "$LOCKFILE" -e checks.md -e deps-stat.txt -e report.md || true)
          if [ -n "$unexpected" ]; then
            echo '::error::The batch touched files outside the lockfile. Not opening a PR — inspect these first:'
            echo "$unexpected"
            exit 1
          fi
          # IGNORED paths as a separate pass — `--ignored` alone collapses a
          # fully-ignored directory to one entry, which is what makes
          # looking affordable; combined with --untracked-files=all it would
          # list every object file under target/ one by one. The allowlist
          # is Cargo's own build directory; anything else ignored is
          # something new in the tree and worth a human look. The run's own
          # scratch files are exempt by exact name: a consumer whose
          # .gitignore happens to match one (a broad `*.md` rule, say)
          # reclassifies the workflow's own report as ignored, and without
          # the exemption every weekly run would abort on a file this job
          # wrote itself.
          planted=$(git status --porcelain -z --ignored \
            | tr '\0' '\n' | sed '/^$/d' \
            | grep '^!! ' \
            | sed 's/^!! //' \
            | grep -Ev '^(.*/)?target/' \
            | grep -Fxv -e report.md -e checks.md -e deps-stat.txt || true)
          if [ -n "$planted" ]; then
            echo '::error::The batch left unexpected IGNORED files in the tree. Not opening a PR — inspect these first:'
            echo "$planted"
            exit 1
          fi
          # Nothing may have touched the lockfile since the engine settled
          # it.
          if [ "$(sha256sum -- "$LOCKFILE" | cut -d' ' -f1)" != "$LOCKFILE_SHA" ]; then
            echo '::error::The lockfile changed AFTER the engine resolved it — something in the check run rewrote it. Not opening a PR.'
            exit 1
          fi
          # Stage the lockfile for the artifact under a fixed literal name:
          # upload-artifact reads its path list as GLOB PATTERNS, so a
          # metacharacter in a custom lockfile path ([, ?) could silently
          # drop the lockfile while the other files keep if-no-files-found
          # happy — the publish job would then fail its fingerprint check on
          # every run. Copied AFTER the tree checks so the copy itself never
          # trips them.
          cp -- "$LOCKFILE" handoff-cargo.lock

      - name: Hand off the dependency diff
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # Fixed literal names — nothing here came from an input, so the
          # action's glob reading cannot misinterpret any of them.
          name: dependency-update
          path: |
            handoff-cargo.lock
            checks.md
            deps-stat.txt
            report.md
          retention-days: 1
          if-no-files-found: error

  # Publishes. Runs on a fresh runner and executes no dependency code —
  # cargo metadata below reads manifests and unpacks crate sources but
  # compiles and runs none of it — so the write token is never on a machine
  # where an unreviewed dependency has run.
  publish:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # This block scopes only the job's own auto-generated GITHUB_TOKEN.
      # When a consumer supplies app-id/app-private-key below, the token
      # this job actually uses is a separate GitHub App installation token,
      # and its effective access comes from the App's OWN permissions (set
      # at installation — see docs/GITHUB_APP.md), not from this block. Kept
      # in step with what GITHUB_TOKEN would need regardless, since a
      # consumer that omits the secrets still runs on it.
      contents: write
      pull-requests: write
      # Dispatching the consumer's CI on the pushed branch is a write to the
      # Actions API — granted HERE and not to the update job, so dependency
      # code can never start a workflow.
      actions: write
    # Read once into env, not referenced as secrets.app-id / secrets.
    # app-private-key directly in the if: conditions below — the secrets
    # context is unavailable there for a reusable workflow's own
    # workflow_call secrets, so an if: naming them outright would just
    # never select the intended branch.
    env:
      APP_ID: ${{ secrets.app-id }}
      APP_PRIVATE_KEY: ${{ secrets.app-private-key }}
    steps:
      # A partial credential mints no token either way; refuse it explicitly
      # rather than silently falling back to GITHUB_TOKEN, which would read
      # as "the App is wired up" while actually still hitting the approval
      # gate docs/GITHUB_APP.md describes.
      - name: Refuse a half-supplied App credential
        if: (env.APP_ID == '') != (env.APP_PRIVATE_KEY == '')
        run: |
          echo "::error::app-id and app-private-key must both be set, or both left empty — one without the other mints no token."
          exit 1

      # Optional: a consumer that wired up docs/GITHUB_APP.md gets a
      # short-lived installation token here instead of GITHUB_TOKEN, so the
      # pull request this job opens is authored by a real collaborator and
      # never trips the first-time-contributor approval gate on the
      # consumer's own on: pull_request workflows — including this job's
      # own dispatch fallback below, which the App token's identity being a
      # real collaborator makes unnecessary. Not pinned by SHA yet — see
      # TODO.md.
      - name: Mint a GitHub App installation token
        id: app-token
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          # Named explicitly rather than left to inherit the App's whole
          # installation grant — matches docs/GITHUB_APP.md's two
          # permissions exactly, so the minted token can never be wider
          # than what this job actually uses even if the App is later
          # installed with more (zizmor: github-app).
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          # The exact commit the update job tested, not the branch tip.
          ref: ${{ needs.update.outputs.base }}
          persist-credentials: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          name: dependency-update
          # Its own directory, so no artifact filename can collide with a
          # consumer's real path — a lockfile literally named
          # handoff-cargo.lock at the root would otherwise be the cp's own
          # destination and fail the publish forever.
          path: .dependency-update

      # The artifact traveled through a machine that ran dependency code;
      # check it against the fingerprint taken before any of that ran. The
      # fingerprint came across as a job output, which lives in the runner's
      # control plane rather than on that machine's disk. The lockfile rode
      # the artifact under its fixed handoff name (upload-artifact globs its
      # path list, so the real path never goes near it) and is restored to
      # its true path here — the lockfile is a tracked file, so its
      # directory already exists in the checkout.
      - name: Check the artifact against the pre-check fingerprint
        env:
          LOCKFILE: ${{ inputs.lockfile }}
          # Update-job outputs enter every run block in this job through
          # env, never inline: `${{ }}` expands into the script BEFORE bash
          # runs, so an output forged on the update runner (the file-command
          # channel its checks step documents as closable only casually)
          # would otherwise become code under this job's write token. As env
          # it is data, and a forged value is bounded to a failed
          # comparison.
          LOCKFILE_SHA: ${{ needs.update.outputs.lockfile_sha }}
        run: |
          set -euo pipefail
          mv -- .dependency-update/checks.md .dependency-update/deps-stat.txt .dependency-update/report.md .
          cp -- .dependency-update/handoff-cargo.lock "$LOCKFILE"
          rm -rf -- .dependency-update
          [ "$(sha256sum -- "$LOCKFILE" | cut -d' ' -f1)" = "$LOCKFILE_SHA" ] \
            || { echo '::error::The lockfile does not match what the update job resolved.'; exit 1; }

      - name: Fetch the validator
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          repository: mikelward/rust-update
          # The exact revision the update job resolved with — never a moving
          # ref, so the batch is validated under the same rules that made
          # it.
          ref: ${{ needs.update.outputs.engine_sha }}
          path: .rust-update
          persist-credentials: false

      # The authoritative check on what this commit contains, and the reason
      # it lives HERE: this runner has executed no dependency code, so
      # `git show HEAD:<lockfile>` and the downloaded artifact are both out
      # of the batch's reach. Only in-place, in-range, stable upgrades (and
      # their add/remove consequences) pass — and --verify-upstream re-asks
      # the registry that each new version exists un-yanked with the
      # registry's own checksum, declares every dependency edge the diff
      # records, and was published outside the cooldown. That last part
      # cannot come from the artifact or the fingerprint: both originated on
      # the machine that later ran the batch's own build code, so code
      # compromised within-range could forge a matching pair naming an
      # hours-old or tampered release. Metadata over HTTPS from a clean
      # runner is exactly the work the trust split allows here.
      - name: Re-validate the dependency diff from a clean context
        env:
          LOCKFILE: ${{ inputs.lockfile }}
          COOLDOWN_DAYS: ${{ inputs.cooldown-days }}
        run: |
          set -euo pipefail
          node .rust-update/check-rust-update.mjs \
            --lockfile "$LOCKFILE" --verify-upstream --cooldown-days "$COOLDOWN_DAYS"
          rm -rf .rust-update

      # The one claim neither the byte rules nor the registry can settle:
      # that the verified lockfile matches the CHECKED-OUT MANIFESTS —
      # including workspace members' own requirements, whose constraints
      # live in Cargo.toml rather than in any index record (an exact pin a
      # forged artifact moved past would slip every registry check). Cargo
      # itself is the authority on that consistency, so ask it: `--locked`
      # fails whenever the lockfile is not exactly what resolution against
      # these manifests would produce. `cargo metadata` executes no
      # dependency code — it reads manifests and the index and unpacks
      # crate sources without compiling anything — so the trust split
      # holds: this runner still never runs what the batch installed.
      - name: Verify the lockfile against the manifests with Cargo
        env:
          LOCKFILE: ${{ inputs.lockfile }}
        run: |
          set -euo pipefail
          # Run FROM the lockfile's directory, not just pointed at it via
          # --manifest-path: both rustup's directory-override lookup and
          # Cargo's hierarchical config discovery (.cargo/config.toml) key
          # off the current directory, not the manifest path. A nested
          # workspace with its own rust-toolchain.toml or cargo config
          # beside it would otherwise be verified under the repository
          # root's toolchain and config instead of the consumer's own —
          # the same directory the update and check steps already cd into.
          cd -- "$(dirname -- "$LOCKFILE")"
          cargo metadata --locked --format-version 1 --manifest-path Cargo.toml > /dev/null

      - name: Stop if the default branch moved while the checks ran
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          # Data, not script text — an apostrophe is legal in a git ref
          # name.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Env, not inline — see the fingerprint step.
          BASE: ${{ needs.update.outputs.base }}
        run: |
          set -euo pipefail
          # Percent-encoded: the argument is a URL path, and characters
          # like `#` are legal in a ref name.
          encoded=$(printf %s "$DEFAULT_BRANCH" | jq -sRr @uri)
          current=$(gh api "repos/${{ github.repository }}/commits/$encoded" --jq .sha)
          if [ "$current" != "$BASE" ]; then
            echo "::error::$DEFAULT_BRANCH moved from $BASE to $current while the checks ran, so the verified lockfile and the branch it would land on no longer match. Re-run the workflow."
            exit 1
          fi

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          LOCKFILE: ${{ inputs.lockfile }}
          # As a git pathspec the lockfile path is data too: `git add` with
          # a filename carrying pathspec syntax (`*`, `?`) would otherwise
          # glob and stage the restored report files alongside the lockfile.
          GIT_LITERAL_PATHSPECS: '1'
          # Data, not script text — a quote or $() in a consumer's input
          # must never change what this write-enabled job executes.
          COMMIT_PREFIX: ${{ inputs.commit-prefix }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          # Whether THIS run minted an App token — not whether the pull
          # request it ends up using was actually opened with one. An
          # adopted rerun can reuse a PR an earlier, non-App attempt
          # opened; the script below derives the real app_opened_pr from
          # this plus whether it pushed or created the PR itself.
          APP_TOKEN_USED: ${{ steps.app-token.outputs.token != '' }}
          # Always GITHUB_TOKEN, never the App token: this step's own
          # GH_TOKEN prefers the App's installation token when one was
          # minted, but the Actions API read below needs Actions:Read,
          # which docs/GITHUB_APP.md deliberately does not ask the App to
          # have (Contents + pull requests only). GITHUB_TOKEN always has
          # it — it is the job that scheduled this very run.
          DEFAULT_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Env, not inline — see the fingerprint step.
          PASSED: ${{ needs.update.outputs.passed }}
          LOCKFILE_SHA: ${{ needs.update.outputs.lockfile_sha }}
        run: |
          set -euo pipefail
          # Keyed on the RUN's date: the job runs weekly, so a month-scoped
          # name would collide with the previous week's branch. The date is
          # the run's immutable created_at, NOT the wall clock — a rerun
          # after UTC midnight would otherwise compute a different name,
          # miss the earlier attempt's branch, and open a duplicate PR for
          # the same batch. (run_started_at won't do: it moves to the
          # latest attempt.) GH_TOKEN overridden for just this command —
          # see DEFAULT_TOKEN above.
          created=$(GH_TOKEN="$DEFAULT_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .created_at)
          today=${created%%T*}
          branch="deps/update-$today"

          # An empty prefix means a bare subject — no stray leading space.
          if [ "$PASSED" != 'true' ]; then
            title="${COMMIT_PREFIX:+$COMMIT_PREFIX }Update dependencies ($today) — CHECKS FAILING"
            verdict='**One or more checks failed.** Do not merge until they are fixed — the failures are real, not flakes to route around.'
          else
            title="${COMMIT_PREFIX:+$COMMIT_PREFIX }Update dependencies ($today)"
            verdict='All checks passed in the job that produced this branch.'
          fi

          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          # Never force-push: the PR body tells reviewers to push fixes to
          # this branch. If today's branch already exists there are two
          # cases, and a RERUN of this very run is the common one: adopt the
          # existing branch when its lockfile is byte-identical to the
          # verified artifact (it is this run's own earlier attempt — reuse
          # it and its PR instead of duplicating them). Anything else is a
          # different batch, so take a run+attempt-scoped name of its own —
          # attempt-scoped so a rerun after a fallback push cannot collide
          # with the earlier attempt's fallback and be rejected.
          adopt=false
          if git ls-remote --exit-code --heads "$remote" "$branch" >/dev/null 2>&1; then
            git fetch --quiet "$remote" "refs/heads/$branch"
            # Adoption vouches for the WHOLE branch, so the whole branch is
            # what gets checked: its complete diff against the recorded base
            # must be exactly the lockfile, that lockfile must match the
            # verified fingerprint, the head must be exactly ONE commit past
            # the base — the shape this run's own earlier attempt pushed —
            # AND that commit's entire message must be the title THIS run
            # intends to merge. The tree checks alone would also admit a
            # change-plus-revert history whose net diff is clean (a rebase
            # merge would replay those junk commits into main), and the
            # message check covers the channel the tree checks can't see: a
            # rebase merge preserves the commit subject, so an earlier
            # failing attempt's "— CHECKS FAILING" marker, or a message
            # amended after the fact, must refuse adoption and take a fresh
            # branch with the right subject instead. (`-z` so a path git
            # would quote still compares literally; `cat-file --filters`,
            # not `git show`, so checkout filters cannot make the compared
            # bytes differ from the fingerprinted working-tree file.)
            diff_paths=$(git diff -z --name-only HEAD FETCH_HEAD | tr '\0' '\n' | sed '/^$/d')
            if [ "$diff_paths" = "$LOCKFILE" ] \
               && [ "$(git rev-list --count HEAD..FETCH_HEAD)" = "1" ] \
               && [ "$(git log -1 --format=%B FETCH_HEAD)" = "$title" ] \
               && [ "$(git cat-file --filters "FETCH_HEAD:$LOCKFILE" 2>/dev/null | sha256sum | cut -d' ' -f1)" = "$LOCKFILE_SHA" ]; then
              adopt=true
              # The exact commit adoption vouched for — auto-merge below is
              # bound to it, so a push landing after this fingerprint cannot
              # ride the arming.
              validated_head=$(git rev-parse FETCH_HEAD)
              echo "Adopting existing branch $branch — base plus exactly the verified lockfile (a rerun)." >> "$GITHUB_STEP_SUMMARY"
            else
              # This run supersedes the earlier attempt: whatever armed the
              # existing branch's PR was computed by an older run, and this
              # run's verdict may be exactly what should hold that batch
              # back. Disarm it before falling back, so an outdated arming
              # cannot merge past today's result; the fallback PR below
              # carries this run's own verdict and its own arming.
              oldpr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?head=${GITHUB_REPOSITORY_OWNER}:${branch}&state=open" \
                --jq '[.[] | select(.base.ref == env.DEFAULT_BRANCH)][0].number // empty')
              if [ -n "$oldpr" ]; then
                # The disarm and the verify are separate on purpose:
                # --disable-auto exits nonzero both when auto-merge was
                # never armed (the common case, fine) and when the API call
                # failed (an armed PR still armed — not fine), so the exit
                # code proves nothing. Only reading the state back does, and
                # a state that cannot be read or is still armed is a STOP:
                # continuing would leave a superseded PR able to merge past
                # this run's verdict.
                gh pr merge --disable-auto "$oldpr" >/dev/null 2>&1 || true
                armed=$(gh pr view "$oldpr" --json autoMergeRequest --jq '.autoMergeRequest != null') || {
                  echo "::error::could not confirm the auto-merge state of superseded PR #$oldpr — not continuing while it may still be armed."
                  exit 1
                }
                if [ "$armed" != 'false' ]; then
                  echo "::error::auto-merge on superseded PR #$oldpr could not be disarmed — not continuing while it is armed."
                  exit 1
                fi
                echo "Auto-merge on PR #$oldpr is confirmed disarmed — its branch is superseded by this run." >> "$GITHUB_STEP_SUMMARY"
              fi
              branch="$branch-run${{ github.run_number }}-${{ github.run_attempt }}"
              echo "Today's branch already exists with different content; using $branch instead." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          if [ "$adopt" != true ]; then
            # Belt and braces on a fresh runner where nothing has run.
            git config --global core.hooksPath /dev/null
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git switch -c "$branch"
            # Stage by name: the artifact only carries these files, but
            # naming the lockfile keeps that true even if it ever carries
            # more.
            git add -- "$LOCKFILE"
            git commit -q -m "$title"
            git push "$remote" "HEAD:refs/heads/$branch"
            validated_head=$(git rev-parse HEAD)
          fi

          # A PR opened under GITHUB_TOKEN's identity DOES trigger a
          # consumer's own `on: pull_request` workflows, same as any other —
          # but GitHub gates that run pending manual approval, since
          # GITHUB_TOKEN's identity (github-actions[bot]) is not a
          # repository collaborator, and nothing runs until someone clicks
          # approve (docs/GITHUB_APP.md). Dispatch sidesteps the gate: ask
          # for one explicitly against the branch just pushed, naming the PR
          # so the consumer's CI can bind the run to it. Only a PR someone
          # retargeted from the default branch is left alone and a fresh,
          # correctly-based one opened beside it (GitHub allows one open PR
          # per head+base pair, so the create succeeds) — the adoption
          # checks above compared the branch's tree against that base, so a
          # retargeted PR would otherwise merge the verified lockfile into a
          # branch nobody validated against.
          pr_opened_here=false
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?head=${GITHUB_REPOSITORY_OWNER}:${branch}&state=open" \
            --jq '[.[] | select(.base.ref == env.DEFAULT_BRANCH)][0].number // empty')
          if [ -z "$pr" ]; then
            pr_url=$(gh pr create --title "$title" \
              --body 'Opening — the checks report lands in a moment.' \
              --base "$DEFAULT_BRANCH" --head "$branch")
            pr=${pr_url##*/}
            pr_opened_here=true
          fi

          # APP_TOKEN_USED says only that THIS invocation minted an App
          # token — not that the pull request open above actually used it.
          # An adopted rerun (adopt=true) reuses whatever PR an EARLIER
          # attempt already opened, possibly under GITHUB_TOKEN if App
          # credentials were added between attempts, with no push and no
          # `gh pr create` of its own to carry the App's identity. Only
          # trust the native trigger when this run itself did one of the
          # two things that puts the App's identity on the wire: pushed the
          # branch fresh (adopt != true, above) or created the pull request
          # here (pr_opened_here). Otherwise fall back to dispatching same
          # as the no-App case — a possibly-redundant CI run is far
          # cheaper than one that silently never starts.
          app_opened_pr=false
          if [ "$APP_TOKEN_USED" = 'true' ] && { [ "$adopt" != true ] || [ "$pr_opened_here" = true ]; }; then
            app_opened_pr=true
          fi

          # Clear any stale auto-merge from a prior attempt NOW, before the
          # CI dispatch below: a required check going green while this step
          # is still editing the body would otherwise merge on an arming
          # this attempt never made. From here to the arming at the bottom,
          # the PR has no auto-merge at all; the passing path re-arms it,
          # pinned to the validated head. Same disarm-then-verify shape as
          # the superseded-branch case above.
          gh pr merge --disable-auto "$pr" >/dev/null 2>&1 || true
          armed=$(gh pr view "$pr" --json autoMergeRequest --jq '.autoMergeRequest != null') || {
            echo "::error::could not confirm the auto-merge state of PR #$pr — not continuing while a stale arming may survive."
            exit 1
          }
          if [ "$armed" != 'false' ]; then
            echo "::error::a stale auto-merge on PR #$pr could not be disarmed — not continuing while it is armed."
            exit 1
          fi

          ci_started=false
          if [ "$app_opened_pr" != 'true' ] && [ -n "$CI_WORKFLOW" ]; then
            # GH_TOKEN overridden to $DEFAULT_TOKEN here too, same as the
            # actions/runs read above: this branch runs whenever an App
            # token was minted but didn't open the PR (an adopted rerun of
            # a non-App PR), so the ambient $GH_TOKEN can still be the App
            # token — which cannot dispatch a workflow, an Actions API
            # write the App's two permissions deliberately exclude.
            if GH_TOKEN="$DEFAULT_TOKEN" gh workflow run "$CI_WORKFLOW" --ref "$branch" -f pr="$pr"; then
              ci_started=true
            else
              echo "Could not start CI on $branch; the PR body says so." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          {
            echo 'Every locked dependency moved to the newest eligible stable release'
            echo '**within its semver-compatible range** (Cargo'"'"'s caret rule: same major,'
            echo 'same minor at 0.x). No breaking moves, direct or transitive — those need'
            echo 'a deliberate migration and this job cannot produce one. Cargo.toml is'
            echo 'untouched; the lockfile pins every transitive exactly, so the diff below'
            echo 'is the complete story.'
            echo
            cat report.md
            echo '## Checks'
            echo
            cat checks.md
            echo
            echo "$verdict"
            echo
            if [ "$app_opened_pr" = 'true' ]; then
              echo '> This pull request was opened under a GitHub App installation'"'"'s'
              echo '> identity — a real repository collaborator — so this repository'"'"'s'
              echo '> `on: pull_request` workflows started on it normally, the same as any'
              echo '> human-opened pull request. Nothing here needed to dispatch them'
              echo '> separately.'
            elif [ "$ci_started" = true ]; then
              echo '> These ran in the workflow job, not on this PR. A pull request opened'
              echo '> under GITHUB_TOKEN'"'"'s identity does trigger this repository'"'"'s own'
              echo '> `on: pull_request` workflows, same as any other — but GitHub gates that'
              echo '> run pending manual approval, since that identity is not a repository'
              echo "> collaborator. This job dispatched \`$CI_WORKFLOW\` against the branch"
              echo '> instead, which sidesteps the gate, and that run reports on this PR like'
              echo '> any other.'
            else
              echo '> **CI was not started on this branch by this job, so the checks above'
              echo '> are the only ones that ran here.** A pull request opened under'
              echo '> GITHUB_TOKEN'"'"'s identity does trigger this repository'"'"'s own'
              echo '> `on: pull_request` workflows, but GitHub gates that run pending manual'
              echo '> approval — check this pull request'"'"'s checks tab for one waiting on'
              echo '> that, or push any commit to the branch and CI runs normally from then'
              echo '> on.'
            fi
            echo
            echo '## Changed'
            echo
            echo '```'
            cat deps-stat.txt
            echo '```'
            echo
            echo '---'
            echo '_Opened by the weekly rust-update workflow._'
          } > body.md

          # A transient API failure here must not strand the PR on its
          # placeholder body under `set -e` — the assignment below still has
          # to run, because the assignee is how an unattended PR gets seen.
          edited=false
          for _ in 1 2 3; do
            if gh pr edit "$pr" --title "$title" --body-file body.md; then
              edited=true
              break
            fi
            sleep 5
          done
          if [ "$edited" != true ]; then
            echo "::warning::Could not publish the PR body for #$pr; it still carries the placeholder."
          fi

          # Put it in front of a human — an unattended weekly PR nobody is
          # assigned to is exactly the PR that goes unnoticed. Non-fatal: an
          # opened-but-unassigned PR is recoverable.
          reviewer='${{ github.repository_owner }}'
          if ! gh pr edit "$pr" --add-assignee "$reviewer" --add-reviewer "$reviewer"; then
            echo "Could not assign or request review from @$reviewer — the PR is open and needs a look." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          # Arm auto-merge so a clean batch lands unattended; the ruleset's
          # required checks do the reviewing. ONLY when this run's own
          # checks passed: auto-merge waits for the ruleset's requirements,
          # and a consumer whose ruleset requires little (or whose CI
          # dispatch failed, leaving nothing red on the PR) would otherwise
          # merge a batch this very workflow titled CHECKS FAILING. A
          # failing batch stays open, assigned, and waits for a human.
          # Non-fatal: repos without auto-merge allowed just fall back to
          # manual.
          #
          # And only where the ruleset requires branches up to date (strict
          # required status checks). Auto-merge can fire long after this
          # job ends, the base-moved check above ran once, and
          # --match-head-commit closes only the ARMING-time race (a
          # concurrent push between the fingerprint and this call) — it is
          # not a binding stored on the auto-merge request, so it cannot
          # veto a head that changes later. Without the strict policy, a
          # base advancing while auto-merge waits would merge this lockfile
          # against manifests it was never validated with. WITH it, the
          # merge blocks until someone with write access updates the
          # branch, and the merged tree must then pass the ruleset's
          # required checks before auto-merge fires — the revalidation is
          # the consumer's own required CI, which is why the ruleset must
          # require it (`--locked` checks refuse a lockfile the updated
          # manifests reject). A push by a user without write access
          # disables auto-merge outright, GitHub's own rule. The policy is
          # verified rather than assumed, and an unreadable answer counts
          # as absent: fail closed to a manual merge. (Effective rules come
          # from the rulesets API; the ruleset is how these repos protect
          # main.)
          # The rules list is paginated; --paginate --slurp gathers every
          # page into one array of pages, so a rule past page one cannot
          # read as "policy absent". --slurp cannot combine with --jq (gh
          # rejects the pair outright), so the query is a separate jq
          # invocation.
          strict=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/rules/branches/$(printf %s "$DEFAULT_BRANCH" | jq -sRr @uri)" \
            | jq '[.[][] | select(.type == "required_status_checks")
                         | .parameters.strict_required_status_checks_policy] | any') || strict=false
          if [ "$PASSED" = 'true' ] && [ "$strict" = 'true' ]; then
            # Any stale arming was cleared right after the PR was
            # identified, so the only arming that can exist after this line
            # is one bound to the exact commit this run validated (the
            # adopted FETCH_HEAD or the commit just pushed): a concurrent
            # push to the branch between the fingerprint and this call would
            # otherwise be what a thin ruleset auto-merges. With the pin,
            # that race makes this command fail — and then the PR simply has
            # no auto-merge and waits for a human.
            if ! gh pr merge --auto --rebase --match-head-commit "$validated_head" "$pr"; then
              echo 'Could not arm auto-merge — the PR is open and waits for a manual merge.' \
                >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ "$PASSED" != 'true' ]; then
            # No arming here, and none survives from before: a prior
            # attempt's request was cleared before CI was dispatched, so the
            # required checks going green cannot merge a PR titled
            # CHECKS FAILING.
            echo 'Checks failed, so auto-merge was deliberately not armed (and any earlier arming was cleared).' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Auto-merge was not armed: the base branch ruleset does not require branches to be up to date, so a base advance while auto-merge waited could merge this lockfile against manifests it was never resolved with. Merge manually, or add the strict status-check policy to the ruleset.' >> "$GITHUB_STEP_SUMMARY"
          fi
